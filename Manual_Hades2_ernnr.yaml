# Q. What is this file?
# A. This file contains options which allow you to configure your multiworld experience while allowing
#    others to play how they want as well.
#
# Q. How do I use it?
# A. The options in this file are weighted. This means the higher number you assign to a value, the
#    more chances you have for that option to be chosen. For example, an option like this:
#
#    map_shuffle:
#      on: 5
#      off: 15
#
#    Means you have 5 chances for map shuffle to occur, and 15 chances for map shuffle to be turned
#    off.
#
# Q. I've never seen a file like this before. What characters am I allowed to use?
# A. This is a .yaml file. You are allowed to use most characters.
#    To test if your yaml is valid or not, you can use this website:
#        http://www.yamllint.com/
#    You can also verify that your Archipelago options are valid at this site:
#        https://archipelago.gg/check

# Your name in-game, limited to 16 characters.
#     {player} will be replaced with the player's slot number.
#     {PLAYER} will be replaced with the player's slot number, if that slot number is greater than 1.
#     {number} will be replaced with the counter value of the name.
#     {NUMBER} will be replaced with the counter value of the name, if the counter value is greater than 1.
name: Player{number}

# Used to describe your yaml. Useful if you have multiple files.
description: Default Manual_Hades2_ernnr Template

game: Manual_Hades2_ernnr
requires:
  version: 0.6.3 # Version of Archipelago required for this yaml to work as expected.

Manual_Hades2_ernnr:
  ################
  # Game Options #
  ################
  progression_balancing:
    # A system that can move progression earlier, to try and prevent the player from getting stuck and bored early.
    #
    # A lower setting means more getting stuck. A higher setting means less getting stuck.
    #
    # You can define additional values between the minimum and maximum values.
    # Minimum value is 0
    # Maximum value is 99
    random: 0
    random-low: 0
    random-high: 0
    disabled: 0 # equivalent to 0
    normal: 50 # equivalent to 50
    extreme: 0 # equivalent to 99

  accessibility:
    # Set rules for reachability of your items/locations.
    #
    # **Full:** ensure everything can be reached and acquired.
    #
    # **Minimal:** ensure what is needed to reach your goal can be acquired.
    full: 50
    minimal: 0

  ################
  # Path Options #
  ################
  underworld_enabled:
    # Whether the Underworld region is enabled.
    # At least one of Underworld or Surface must be enabled.
    "false": 0
    "true": 50

  surface_enabled:
    # Whether the Surface region is enabled.
    # At least one of Underworld or Surface must be enabled.
    "false": 0
    "true": 50

  ####################
  # Guardian Options #
  ####################
  unrivaled_guardians_enabled:
    # Adds locations for defeating each Unrivaled Guardian.
    "false": 50
    "true": 0

  guardians_1_fear_enabled:
    # Adds locations for defeating each Guardian with 1 Fear.
    "false": 50
    "true": 0

  guardians_2_fear_enabled:
    # Adds locations for defeating each Guardian with 2 Fear.
    "false": 50
    "true": 0

  guardians_4_fear_enabled:
    # Adds locations for defeating each Guardian with 4 Fear.
    "false": 50
    "true": 0

  guardians_8_fear_enabled:
    # Adds locations for defeating each Guardian with 8 Fear.
    "false": 50
    "true": 0

  guardians_16_fear_enabled:
    # Adds locations for defeating each Guardian with 16 Fear.
    "false": 50
    "true": 0

  guardians_32_fear_enabled:
    # Adds locations for defeating each Guardian with 32 Fear.
    "false": 50
    "true": 0

  ##################################
  # Miscellaneous Location Options #
  ##################################
  wardens_enabled:
    # Adds locations for defeating each Warden.
    "false": 0
    "true": 50

  npcs_enabled:
    # Adds locations for meeting each NPC.
    "false": 0
    "true": 50

  olympians_enabled:
    # Adds locations for meeting each Olympian.
    "false": 0
    "true": 50

  ##############################
  # Miscellaneous Item Options #
  ##############################
  awakening_enabled:
    # Adds items for Arcana Cards with Awakening conditions.
    # If disabled, then cards with Awakening conditions can be used whenever.
    # If enabled, then the player's Arcana Card configurations should be restricted, so that Arcana Cards that have not been received are not accidentally Awakened.
    "false": 0
    "true": 50

  hidden_aspects_enabled:
    # Adds items for each Hidden Aspect.
    "false": 0
    "true": 50

  #################
  # Grasp Options #
  #################
  Grasp_For_Victory:
    # The amount of Grasp required for victory.
    # After this amount of Grasp is reached, the player must defeat either final guardian (Chronos or Typhon) to claim victory.
    #
    # You can define additional values between the minimum and maximum values.
    # Minimum value is 0
    # Maximum value is 30
    30: 50
    random: 0
    random-low: 0
    random-high: 0

  ############################
  # Progressive Item Options #
  ############################
  progressive_arcana_cards_enabled:
    # Adds progressive items for Arcana Cards.
    # Should only be enabled if using a custom save file that has all Weapons, Aspects, and Arcana Cards at level 0 or 1, and the resources necessary to upgrade them.
    # Should not be enabled if using a completed save file.
    "false": 50
    "true": 0

  progressive_weapons_and_aspects_enabled:
    # Adds progressive items for Weapons and Aspects.
    # Should only be enabled if using a custom save file that has all Weapons, Aspects, and Arcana Cards at level 0 or 1, and the resources necessary to upgrade them.
    # Should not be enabled if using a completed save file.
    "false": 50
    "true": 0

  ##########################
  # Location Clear Options #
  ##########################
  locations_1_fear_enabled:
    # Adds locations for clearing each location with 1 Fear.
    "false": 50
    "true": 0

  locations_2_fear_enabled:
    # Adds locations for clearing each location with 2 Fear.
    "false": 50
    "true": 0

  locations_4_fear_enabled:
    # Adds locations for clearing each location with 4 Fear.
    "false": 50
    "true": 0

  locations_8_fear_enabled:
    # Adds locations for clearing each location with 8 Fear.
    "false": 50
    "true": 0

  locations_16_fear_enabled:
    # Adds locations for clearing each location with 16 Fear.
    "false": 50
    "true": 0

  locations_32_fear_enabled:
    # Adds locations for clearing each location with 32 Fear.
    "false": 50
    "true": 0

  ###########################
  # Item & Location Options #
  ###########################
  local_items:
    # Forces these items to be in their native world.
    []

  non_local_items:
    # Forces these items to be outside their native world.
    []

  start_inventory:
    # Start with these items.
    {}

  start_inventory_from_pool:
    # Start with these items and don't place them in the world.
    #
    # The game decides what the replacement items will be.
    {}

  start_hints:
    # Start with these item's locations prefilled into the ``!hint`` command.
    []

  start_location_hints:
    # Start with these locations and their item prefilled into the ``!hint`` command.
    []

  exclude_locations:
    # Prevent these locations from having an important item.
    []

  priority_locations:
    # Prevent these locations from having an unimportant item.
    []

  item_links:
    # Share part of your item pool with other players.
    []

  plando_items:
    # Generic items plando.
    []
